<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專題報告</title>
    <style>
        :root {
            --bg: #020617;
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #ff6b2c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .deck-toolbar {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 20;
            display: flex;
            gap: 10px;
        }

        .toolbar-link {
            min-height: 40px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
            color: var(--text);
            background: rgba(2, 6, 23, 0.68);
            backdrop-filter: blur(10px);
            text-decoration: none;
            font-weight: 700;
        }

        .toolbar-link:hover {
            border-color: var(--accent);
            color: #fff;
        }

        .slide {
            width: 100%;
            min-height: 100vh;
            display: grid;
            place-items: center;
            scroll-snap-align: start;
            background: #020617;
        }

        .slide img {
            width: 100%;
            height: 100vh;
            display: block;
            object-fit: contain;
            background: #020617;
        }

        .empty-slide {
            width: min(980px, calc(100vw - 40px));
            min-height: min(620px, calc(100vh - 80px));
            display: grid;
            place-items: center;
            padding: 36px;
            border: 1px dashed rgba(255, 255, 255, 0.28);
            border-radius: 8px;
            text-align: center;
            background: rgba(15, 23, 42, 0.72);
        }

        .empty-slide h1 {
            margin: 0 0 14px;
            font-size: 36px;
        }

        .empty-slide p {
            margin: 0;
            color: var(--muted);
            line-height: 1.8;
        }

        @media (max-width: 760px) {
            .deck-toolbar {
                left: 12px;
                right: 12px;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <nav class="deck-toolbar" aria-label="報告導覽">
